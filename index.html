<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhysioTeam Soroka</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ─── HEADER ─── -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <!-- Head -->
            <circle cx="9" cy="3.8" r="1.9" fill="currentColor" stroke="none"/>
            <!-- Torso -->
            <line x1="9" y1="5.7" x2="9" y2="14"/>
            <!-- Left arm raised (rehab motion) -->
            <line x1="9" y1="9" x2="4.5" y2="6"/>
            <!-- Right arm forward -->
            <line x1="9" y1="9" x2="14" y2="11.5"/>
            <!-- Legs -->
            <line x1="9" y1="14" x2="6.5" y2="20"/>
            <line x1="9" y1="14" x2="11.5" y2="20"/>
            <!-- Therapy wave (healing symbol) -->
            <path d="M17 7 Q18 5 19 7 Q20 9 21 7" stroke-width="2.2"/>
            <path d="M17 11 Q18 9 19 11 Q20 13 21 11" stroke-width="2.2"/>
          </svg>
        </div>
        <div class="brand-name">
          <span class="brand-primary">PhysioTeam</span>
          <span class="brand-secondary">שיקום סורוקה</span>
        </div>
      </div>

      <nav class="view-tabs">
        <button class="tab" data-view="daily">יומי</button>
        <button class="tab active" data-view="weekly">שבועי</button>
        <button class="tab" data-view="monthly">חודשי</button>
      </nav>

      <div class="header-actions">
        <button class="panel-trigger" id="therapistsPanelBtn" data-panel="therapists">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>מטפלים</span>
        </button>
        <button class="panel-trigger" id="patientsPanelBtn" data-panel="patients">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>מטופלים</span>
        </button>
        <button class="auto-assign-btn" id="autoAssignBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          שיבוץ אוטומטי
        </button>
        <button class="panel-trigger" id="optionsPanelBtn" data-panel="options">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ─── STATS BAR ─── -->
  <div id="statsBarContainer"></div>

  <!-- ─── DATE NAV ─── -->
  <div class="date-toolbar">
    <div class="toolbar-inner">
      <button class="arrow-btn" id="prevPeriod">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div class="period-info">
        <h2 class="period-title" id="periodTitle"></h2>
      </div>
      <button class="arrow-btn" id="nextPeriod">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="today-btn" id="goToday">היום</button>
    </div>
  </div>

  <!-- ─── MAIN ─── -->
  <main class="app-main">
    <div id="weeklyView"  class="view"></div>
    <div id="dailyView"   class="view"></div>
    <div id="monthlyView" class="view"></div>
  </main>

  <!-- ─── SIDE PANEL ─── -->
  <div class="panel-backdrop" id="panelBackdrop"></div>

  <aside class="side-panel" id="sidePanel">
    <div class="sp-header">
      <div class="sp-tabs">
        <button class="sp-tab" data-panel="therapists">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          מטפלים
        </button>
        <button class="sp-tab" data-panel="patients">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          מטופלים
        </button>
      </div>
      <button class="sp-close" id="closeSidePanel">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sp-body" id="spBody"></div>
  </aside>

  <!-- ─── TREATMENT WARNING MODAL ─── -->
  <div class="modal-overlay hidden" id="warningModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="warningModalTitle">התרעת טיפולים</h3>
      </div>
      <div class="modal-body" id="warningModalBody"></div>
    </div>
  </div>

  <!-- ─── ASSIGNMENT MODAL ─── -->
  <div class="modal-overlay hidden" id="assignModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="assignModalTitle">שיבוץ מטופל</h3>
        <button class="modal-close" id="closeAssignModal">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="assignModalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
